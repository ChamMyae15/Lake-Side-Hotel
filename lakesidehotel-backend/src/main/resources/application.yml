# yaml-language-server: $schema=https://json.schemastore.org/spring-boot.json
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lakeside_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB
